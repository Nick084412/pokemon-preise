# Täglicher Markt-Abruf: Cardmarket-Preise aller Karten aus Schwert & Schild, Karmesin & Purpur und Mega-Entwicklung
# (über TCGdex). Daraus entstehen die Listen „Begehrteste Karten“ und „Gewinner & Verlierer“ sowie der Preisverlauf
# für Kartenansicht und Portfolio. TCGdex aktualisiert die Preise gegen 23 Uhr UTC, deshalb läuft der Abruf nachts.
name: Markt-Abruf
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-preise
  cancel-in-progress: false

jobs:
  markt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Marktpreise abrufen
        run: python3 abruf/markt.py
      - name: Ergebnis speichern
        run: |
          git config user.name "Pokémon-Preise"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/markt
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git commit -m "Markt $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
